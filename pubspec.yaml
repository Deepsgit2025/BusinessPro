name: business_pro
description: "BusinessPro — Offline-first accounting & invoicing app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # PDF & Printing
  pdf: ^3.11.3
  printing: ^5.14.2

  # Thermal printing (ESC/POS)
  # Bluetooth — Android only; never imported on the Windows code path.
  flutter_blue_plus: ^1.32.12
  # NOTE: USB thermal support is temporarily disabled. The only published
  # usb_serial (0.5.2) ships an outdated Gradle config (AGP 4.1.0, jcenter) that
  # fails to configure under this project's modern AGP, breaking the Android
  # release build. UsbPrinterService is stubbed as "unavailable" until a
  # maintained USB-serial plugin is wired in. Bluetooth + Network thermal work.

  # Sharing
  share_plus: ^13.1.0

  # Launching SMS / dialler / external apps
  url_launcher: ^6.3.1

  # Image picking (logo/signature, scan-bill camera/gallery)
  image_picker: ^1.1.2

  # On-device OCR for "Scan Bill" (Android only; no network/API key).
  # Downloads its text-recognition models on first use, then works offline.
  google_mlkit_text_recognition: ^0.13.0

  # On-screen signature drawing pad
  signature: ^6.3.0

  # Charts (reports)
  fl_chart: ^0.70.2

  # Formatting
  intl: ^0.20.2

  # Unique IDs
  uuid: ^4.5.1

  # Light key-value settings
  shared_preferences: ^2.3.5

  # SHA-256 hashing for the optional PIN lock (Phase 6 Layer 1)
  crypto: ^3.0.3

  # Firebase
  firebase_core: ^3.15.1
  cloud_firestore: ^5.6.9

  # ── Phase 5: Google Drive sync ──────────────────────────────────────────────
  # Google Sign-In (Android only — used to obtain a Drive OAuth token). Windows
  # never calls this; it receives the token via the QR handoff instead.
  google_sign_in: ^6.2.1
  # HTTP client for the Drive v3 REST calls (works on Android + Windows).
  http: ^1.2.2
  # Detect internet availability before attempting a sync.
  connectivity_plus: ^6.1.0

  # Picking a .db file for "Restore from File".
  # 12.0.0-beta is the first line compatible with win32 ^6 (required by
  # share_plus 13); earlier file_picker pins win32 ^5 and conflicts.
  file_picker: ">=12.0.0-beta.5 <13.0.0"
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.14
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
